<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout</title>
    <style>
        header, footer {
            display: flex;
            height: 10vh;
            justify-content: center;
            align-items: center;
            background-color: #373737;
            color: #ececec;
        }

        .grid_container {
            height: 80vh;
            display: grid;
            grid-template-columns: 150px auto;
        }

        .aside {
            display: flex;
            flex-wrap: wrap;
            flex-ditection: column;
            background-color: #5a5a5a;
            padding: 0.5rem;
        }

        .product_option {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 1rem;
            width: 100%;
            height: 19%;
            background-color: #c4c4c3;
            border-radius: 5px;
        }

            .product_option:hover {
                opacity: 90%;
            }

        .main {
            display: flex;
            background-color: #ebebeb;
            padding: 0.8rem;
            gap: 0.8rem;
        }

        .section {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 33%;
            background-color: #c4c4c3;
            border-radius: 3px;
        }

        @media (max-width: 750px) {
            .main {
                flex-direction: column;
            }

            .section {
                width: 100%;
                height: 33%;
            }
        }
    </style>
</head>

<body>
    <header>Header</header>
    <section class="grid_container">
        <div class="aside">
            <div class="product_option">Product №1</div>
            <div class="product_option">Product №2</div>
            <div class="product_option">Product №3</div>
            <div class="product_option">Product №4</div>
            <div class="product_option">Product №5</div>
        </div>
        <div class="main">
            <div class="section">Content Section 1</div>
            <div class="section">Content Section 2</div>
            <div class="section">Content Section 3</div>
        </div>
    </section>
    <footer>Footer</footer>
</body>

</html>
