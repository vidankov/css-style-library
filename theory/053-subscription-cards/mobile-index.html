<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Mono&display=swap">
    <title>Подписка на закрытый канал</title>
    <style>
        body {
            /* Используется шрифт Montserrat для текста внутри body */
            font-family: 'Montserrat', sans-serif;
        }

        .subscription_rates_container {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .card {
            /* Цвет фона карточки */
            background-color: #abedde;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-content: space-evenly;
            flex: 0 1 0;
            padding: 10px 5px;
            border-radius: 10px;
        }

        .card h2 {
            /* Внутренний отступ для заголовка h2 */
            display: flex;
            margin: 5px;
            text-align: center;
        }

        .card a {
            display: flex;
            align-self: center;
        }

        .price {
            /* Размер шрифта цены */
            display: flex;
            align-self: center;
            font-size: 20px;
            /* Жирное начертание для цены */
            font-weight: bold;
        }


        .button {
            /* Цвет фона кнопки */
            /* background-color: #4CAF50; */
            display: flex;
        }

        .button:hover {
            /* Изменение цвета фона кнопки при наведении */
            background-color: #37873b;
        }

        ul {
            /* Удаление маркеров списка */
            list-style: none;
            display: flex;
            align-self: center;
            padding: 5px;
        }

        li {
            /* Внешний отступ элементов списка */
            margin: 5px 0;
            display: flex;
        }

        @media (max-width: 750px) {
            .subscription_rates_container {
                flex-direction: column;
            }
            .card {
                flex-direction: column;
            }
        }

        /*@media (max-width: 768px) {
            body {*/
                /* Изменение направления отображения элементов при ширине экрана до 768px */
                /*flex-direction: column;*/
                /* Выравнивание элементов по центру при изменении направления */
                /*align-items: center;
            }
        }*/
    </style>
</head>

<body>
    <section class="subscription_rates_container">
        <div class="card">
            <h2>Базовая подписка</h2>
            <ul>
                <li>✅ Бонус 1</li>
                <li>❎ Бонус 2</li>
                <li>❎ Бонус 3</li>
            </ul>
            <div class="price">&#8381; 199/месяц</div>
            <a href="#" class="button">Подписаться</a>
        </div>

        <div class="card">
            <h2>Продвинутая подписка</h2>
            <ul>
                <li>✅ Бонус 1</li>
                <li>✅ Бонус 2</li>
                <li>❎ Бонус 3</li>
            </ul>
            <div class="price">&#8381; 299/месяц</div>
            <a href="#" class="button">Подписаться</a>
        </div>

        <div class="card">
            <h2>Премиум подписка</h2>
            <ul>
                <li>✅ Бонус 1</li>
                <li>✅ Бонус 2</li>
                <li>✅ Бонус 3</li>
            </ul>
            <div class="price">&#8381; 599/месяц</div>
            <a href="#" class="button">Подписаться</a>
        </div>
    </section>

</body>

</html>
