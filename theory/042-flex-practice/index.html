<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }

        ul.menu {
            display: inline-flex;
            list-style: none;
            gap: 20px;
        }

        ul.menu li {
            background-color: #ffe4c4;
            padding: 20px;
            border-radius: 10px;
            font-size: 1.2rem;
            font-weight: 600;
        }

    </style>
    <title>Flex-список меню</title>
</head>

<body>
    <ul class="menu">
        <li>Главная</li>
        <li>О&nbsp;нас</li>
        <li>Услуги</li>
        <li>Портфолио</li>
        <li>Контакты</li>
    </ul>
</body>

</html>
